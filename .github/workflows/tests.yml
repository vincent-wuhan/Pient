name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: JVM / Robolectric / MockWebServer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch x86_64 runtime
        run: python3 runtime/scripts/fetch_rootfs.py --abi x86_64

      - name: Run unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest -PpientRuntimeAbi=x86_64

  emulator:
    name: API 35 x86_64 emulator
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch x86_64 runtime
        run: python3 runtime/scripts/fetch_rootfs.py --abi x86_64

      - name: Build debug and Android test APKs
        run: >-
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          -PpientRuntimeAbi=x86_64

      - name: Run instrumented and Maestro smoke tests
        uses: reactivecircus/android-emulator-runner@v1
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest -PpientRuntimeAbi=x86_64
            curl -fsSL https://get.maestro.mobile.dev | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/smoke.yaml
